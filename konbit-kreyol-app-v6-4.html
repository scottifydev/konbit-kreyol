<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konbit Kreyòl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Black&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f0e9d8; --bone:#e6dcc4; --rule:#c9bda0; --ink:#1b2030; --dim:#6b6555;
    --cobalt:#1a3fc4; --cobalt-sh:#122d8f;
    --red:#d02c22;    --red-sh:#9c1f18;
    --sun:#f2b02c;    --sun-sh:#c78d1a;
    --palm:#2e7d4f;
    --slate:#22303a;  --chalk:#f0e9d8;
    --disp:'Alfa Slab One','Archivo Black',serif;
    --sans:'Instrument Sans',system-ui,sans-serif;
    --serif:'Instrument Serif',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:5px;z-index:200;
    background:linear-gradient(90deg,var(--cobalt) 0 33.4%,var(--sun) 33.4% 66.7%,var(--red) 66.7% 100%)}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  ::selection{background:var(--sun)}
  h1,h2,h3{font-weight:400}

  .disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em;line-height:1.12}
  .d1{font-size:clamp(34px,5vw,44px)} .d2{font-size:28px} .d3{font-size:20px}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .dim{color:var(--dim)} .note{font-size:12.5px;color:var(--dim)}
  .num{font-variant-numeric:tabular-nums;font-weight:700}
  .heronum{font-family:var(--disp);font-size:34px;line-height:1}
  .stripe{height:4px;border:none;margin:14px 0;
    background:linear-gradient(90deg,var(--cobalt) 0 33.4%,var(--sun) 33.4% 66.7%,var(--red) 66.7% 100%)}

  .paint{position:relative;color:var(--paper)}
  .paint::after{content:"";position:absolute;inset:5px;border:1px solid var(--paper);pointer-events:none}
  .paint.cobalt{background:var(--cobalt)} .paint.red{background:var(--red)}
  .board{background:var(--slate);color:var(--chalk)}
  .goldsheet{background:var(--sun);color:var(--ink);position:relative}
  .goldsheet::after{content:"";position:absolute;inset:6px;border:1.5px solid var(--ink);pointer-events:none}
  .stamp{display:inline-block;border:2.5px solid var(--ink);padding:3px 12px;font-size:11.5px;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;transform:rotate(-1.5deg);background:var(--paper)}
  .stamp.palm{border-color:var(--palm);color:var(--palm)}
  .tike{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);padding:4px 12px;
    font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--paper);white-space:nowrap}
  .tike b{font-family:var(--disp);font-weight:400;font-size:15px}
  .tike .perf{border-left:1.5px dashed var(--ink);padding-left:8px;margin-left:2px}
  .tike.leo{border-color:var(--cobalt);color:var(--cobalt)} .tike.leo .perf{border-color:var(--cobalt)}
  .tike.isaac{border-color:var(--red);color:var(--red)} .tike.isaac .perf{border-color:var(--red)}
  .tike.sunb{background:var(--sun)}

  /* LANGUAGE AFFORDANCES — de-conflated (audit fix)
     .gloss  = tappable content word (feed & app-word chips): sun sweep, tap = meaning, long-press = same
     .flipnew = chrome string newly flipped this unit: sun underline only, long-press = English */
  .gloss{padding:0 4px;font:inherit;color:var(--ink);background:var(--sun);box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .gloss:hover{background:var(--ink);color:var(--sun)}
  .flipnew{border-bottom:3px solid var(--sun)}

  .cta{display:inline-block;font-family:var(--disp);font-size:17px;letter-spacing:.03em;padding:13px 26px;
    color:var(--paper);border:2px solid var(--ink)}
  .cta.cobalt{background:var(--cobalt);box-shadow:5px 5px 0 var(--cobalt-sh)}
  .cta.red{background:var(--red);box-shadow:5px 5px 0 var(--red-sh)}
  .cta.sun{background:var(--sun);color:var(--ink);box-shadow:5px 5px 0 var(--sun-sh)}
  .cta:active{transform:translate(3px,3px)}
  .btn{display:inline-block;font-weight:700;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;
    padding:9px 16px;border:2px solid var(--ink);background:var(--paper)}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn.chalk{border-color:var(--chalk);background:transparent;color:var(--chalk)}
  .btn.chalk:hover{background:var(--chalk);color:var(--slate)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  header{position:sticky;top:0;z-index:100;background:var(--paper);border-bottom:2px solid var(--ink)}
  .mast{padding:14px 0 0}
  .mast .in{max-width:980px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .plate{font-family:var(--disp);font-size:19px;color:var(--ink);padding:6px 18px 6px 14px;white-space:nowrap;
    background:var(--paper);border:2px solid var(--ink);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
  .plate .k1{color:var(--cobalt)} .plate .k2{color:var(--red)}
  .mast .who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .gauge{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
  nav.tabs{max-width:980px;margin:6px auto 0;padding:0 24px;display:flex;gap:2px;flex-wrap:wrap}
  .tab{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;color:var(--dim)}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);background:var(--sun)}
  .band{height:34px;display:flex;align-items:center;color:var(--paper)}
  .band .in{max-width:980px;margin:0 auto;padding:0 24px;width:100%;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  .band.leo{background:var(--cobalt)} .band.isaac{background:var(--red)}
  .band .flipnew{border-bottom-color:var(--paper)}

  main{max-width:980px;margin:0 auto;padding:30px 24px 120px;animation:deal .2s ease both}
  @keyframes deal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes stampin{from{transform:scale(1.15) rotate(-1.5deg);opacity:0}to{transform:scale(1) rotate(-1.5deg);opacity:1}}
  .stamp.new{animation:stampin .12s ease-out both}
  @media (prefers-reduced-motion:reduce){main,.stamp.new,.receipt{animation:none!important}}

  .ruled{position:relative;padding-left:34px}
  .ruled::before{content:"";position:absolute;left:18px;top:4px;bottom:4px;width:1.5px;background:var(--red)}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px;flex-wrap:wrap}
  .row:last-child{border-bottom:none}
  .panel{border:2px solid var(--ink);background:var(--paper)}
  .panel.well{background:var(--bone)}

  .lead{border:2.5px solid var(--ink);padding:26px 28px;background:var(--paper)}
  .lead .kicker{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .steps{list-style:none;margin:16px 0 20px}
  .steps li{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .steps li:last-child{border-bottom:none}
  .steps .t{min-width:56px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--dim)}
  .steps .ok{color:var(--palm);font-weight:700}
  table.standings{width:100%;border-collapse:collapse;font-size:14px}
  .standings th{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    text-align:right;padding:8px 10px;border-bottom:2px solid var(--ink)}
  .standings th:first-child{text-align:left}
  .standings td{padding:10px;text-align:right;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
  .standings td:first-child{text-align:left;font-weight:700}
  .standings .sw{display:inline-block;width:11px;height:11px;margin-right:8px;vertical-align:baseline}
  .barcell{position:relative;height:10px;background:var(--bone);min-width:80px}
  .barcell i{position:absolute;top:0;bottom:0;left:0}
  .index{margin-top:26px}
  details.drawer{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:26px}
  details.drawer summary{cursor:pointer;padding:13px 2px;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
  details.drawer summary::after{content:"+"}
  details.drawer[open] summary::after{content:"–"}
  .gmap{display:grid;grid-template-columns:1fr 54px 54px;gap:7px 12px;padding:6px 2px 18px;font-size:13.5px;align-items:center}
  .gmap .h{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--dim);text-align:center;text-transform:uppercase}
  .cell{height:11px;background:var(--bone);border:1px solid var(--rule)}
  .cell.act{background:var(--sun);border-color:var(--ink)}
  .cell.solid{background:var(--palm);border-color:var(--ink)}

  .col{max-width:620px;margin:0 auto}
  .entry{padding:18px 20px;border:2px solid var(--ink);background:var(--paper);margin:16px 0}
  .pfp{width:42px;height:42px;border:2px solid var(--ink);background:var(--bone);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
  .instr{display:flex;gap:26px;align-items:center;flex-wrap:wrap;border:2px solid var(--ink);padding:18px 22px;margin-top:26px;background:var(--paper)}
  .meters{flex:1;min-width:240px}
  .meter{display:grid;grid-template-columns:88px 1fr 44px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px;font-weight:700}
  .meter:last-child{margin-bottom:0}
  .meterbar{height:12px;border:2px solid var(--ink);background:var(--paper)}
  .meterbar i{display:block;height:100%}
  .meter .pc{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  .entry .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .entry .who{font-weight:800;font-size:14px}
  .entry .sub{font-size:12px;color:var(--dim)}
  .entry .tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .entry .kt{font-size:19px;line-height:1.65}
  .entry.quote .kt{font-family:var(--serif);font-style:italic;font-size:21px;border-left:5px solid var(--sun);padding-left:14px}
  .entry .en{display:block;font-size:13px;color:var(--dim);font-style:italic;margin-top:8px}
  .entry .acts{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
  .entry .acts button{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:4px 0;border-bottom:2px solid transparent}
  .entry .acts button:hover{color:var(--ink);border-color:var(--ink)}
  .entry .acts .on{color:var(--ink);border-color:var(--sun);background:var(--sun);padding:4px 8px}
  .revmark{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--red)}
  .duebadge{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--cobalt)}
  .femen{margin:30px auto 0;max-width:420px;text-align:center;padding:30px 24px}
  .femen .disp{font-size:34px}

  .stage{max-width:620px;margin:0 auto}
  .boardbox{padding:38px 34px;border:3px solid var(--ink);position:relative}
  .boardbox .tray{position:absolute;left:-3px;right:-3px;bottom:-14px;height:11px;background:var(--bone);border:2px solid var(--ink)}
  .chalkbar{height:5px;background:#324453;margin:-38px -34px 26px;position:relative}
  .chalkbar i{position:absolute;left:0;top:0;bottom:0;background:var(--chalk)}
  .qp{font-family:var(--disp);font-size:clamp(26px,4.4vw,38px);line-height:1.15;text-align:center;margin:8px 0 26px}
  .opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .opt{border:2px dashed var(--chalk);color:var(--chalk);padding:13px 26px;font-size:17px;font-weight:700;min-width:120px}
  .opt:hover{border-style:solid;background:#2c3d49}
  .opt.hit{border-style:solid;border-radius:50%/45%;border-width:2.5px}
  .opt.miss{text-decoration:line-through;text-decoration-thickness:2.5px;opacity:.75}
  .fb{text-align:center;min-height:24px;margin-top:16px;font-size:14.5px;color:var(--chalk)}
  .fb .yes{border-bottom:2px solid var(--sun)}
  .boardnote{text-align:center;font-size:12px;color:#8ba0af;margin-top:14px}
  .chalkrule{max-width:400px;margin:14px auto 0;text-align:left;line-height:2.1;font-size:15px}
  .chalkrule b{color:var(--sun);font-weight:700}
  .board .flipnew{border-bottom-color:var(--sun)}

  .panorama{display:block;width:100%;max-width:620px;margin:8px auto}
  .legs{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:18px 0}
  .legcard{flex:1;min-width:230px;max-width:290px;border:2px solid var(--ink);padding:16px 18px;background:var(--paper);text-align:left}
  .legcard.done{border-color:var(--palm)}
  .legcard.now{background:var(--bone)}
  .legcard .lh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .chipav{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;color:var(--paper)}
  .chipav.leo{background:var(--cobalt)} .chipav.isaac{background:var(--red)}
  .konsey{border-left:4px solid var(--sun);padding:6px 0 6px 12px;margin-top:8px;font-size:13.5px}
  .summitbar{max-width:460px;margin:0 auto}
  .summitbar .t{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .sbar{height:14px;border:2px solid var(--ink);background:var(--paper)}
  .sbar i{display:block;height:100%;background:var(--sun)}

  .poster{padding:34px 32px}
  .poster h2{font-family:var(--disp);font-size:clamp(26px,4vw,34px);margin:10px 0 8px}
  .starrow{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
  .starbox{display:flex;gap:6px}
  .star{width:30px;height:30px;border:2px solid var(--ink);background:var(--paper);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .star.on{background:var(--ink);color:var(--sun)}

  .recfield{border:3px solid var(--ink);padding:22px;text-align:center;margin-top:16px;background:var(--paper)}
  .recfield.live{background:var(--red);color:var(--paper)}
  .recfield .heronum{font-size:44px}
  .prompts{list-style:none;margin:16px 0;text-align:left}
  .prompts li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);font-size:16px}
  .prompts li:last-child{border-bottom:none}
  .prompts .ref{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

  .gate{max-width:900px;margin:0 auto;text-align:center;padding-top:28px}
  .gate .masttitle{font-family:var(--disp);font-size:clamp(40px,7vw,64px);line-height:1.05}
  .gate .k1{color:var(--cobalt)} .gate .k2{color:var(--red)}
  .gate .tag{font-family:var(--serif);font-style:italic;font-size:19px;margin-top:8px}
  .doors{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:30px;border:3px solid var(--ink)}
  @media (max-width:640px){.doors{grid-template-columns:1fr}}
  .door{padding:34px 26px 30px;text-align:left;position:relative}
  .door::after{content:"";position:absolute;inset:7px;border:1.5px solid var(--paper);pointer-events:none}
  .door.leo{background:var(--cobalt);color:var(--paper)}
  .door.isaac{background:var(--red);color:var(--paper)}
  .door:hover{filter:brightness(1.06)}
  .door .nm{font-family:var(--disp);font-size:clamp(34px,5vw,48px);line-height:1}
  .door .meta{font-size:12.5px;letter-spacing:.06em;margin:8px 0 16px;text-transform:uppercase;font-weight:700}
  .door .stats{display:flex;gap:16px;font-size:12px;font-weight:700;letter-spacing:.04em;flex-wrap:wrap}
  .door .stats b{font-family:var(--disp);font-weight:400;font-size:19px;display:block}
  .goldband{background:var(--sun);color:var(--ink);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
    padding:12px 20px;font-weight:700;font-size:14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;grid-column:1/-1}

  .receipt{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:300;background:var(--paper);
    border:2px solid var(--ink);border-bottom:none;padding:12px 22px 16px;font-size:13.5px;font-weight:600;
    animation:rise .2s ease both;max-width:90vw}
  .receipt::before{content:"";position:absolute;top:6px;left:8px;right:8px;border-top:1.5px dashed var(--rule)}
  @keyframes rise{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}

  .hinttip{position:fixed;z-index:400;background:var(--slate);color:var(--chalk);border:2px solid var(--ink);
    padding:9px 14px;font-size:13px;pointer-events:none;max-width:280px}

  .devchip{position:fixed;bottom:16px;right:16px;z-index:150;border:2px solid var(--ink);background:var(--paper);
    padding:6px 13px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .devchip:hover{background:var(--ink);color:var(--paper)}
  .devpanel{position:fixed;bottom:58px;right:16px;z-index:150;background:var(--paper);border:2px solid var(--ink);
    padding:16px;width:250px;display:none;box-shadow:6px 6px 0 var(--rule)}
  .devpanel.open{display:block}
  .devpanel .row{font-size:12.5px;padding:8px 0}
  .devpanel button,.devpanel select{border:1.5px solid var(--ink);background:var(--paper);padding:4px 10px;font-size:12px;font-weight:700}
  .devpanel button:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>

<div id="app"></div>
<div id="tip" class="hinttip" style="display:none"></div>

<button class="devchip" id="devToggle">Prototype</button>
<div class="devpanel" id="devPanel">
  <div class="row" style="display:flex;justify-content:space-between"><span>Sim day</span><span><b class="num" id="devDay"></b> <button id="devAdvance">+1</button></span></div>
  <div class="row" style="display:flex;justify-content:space-between"><span>Unit</span><select id="devUnit"></select></div>
  <div class="row" style="display:flex;gap:8px"><button id="devExport">Export</button><button id="devReset">Reset</button><button id="devLint">Lint</button></div>
  <div class="note">Real build: file persistence + native-review gate + language-lint CI (§10, audit).</div>
</div>

<script>
"use strict";
/* KONBIT KREYÒL v6.1 — language-law repair release.
   Changes vs v6 (per audit):
   1. 100% of chrome routes through T(). Zero Kreyòl literals in templates outside content data.
   2. Product-name whitelist (closed set) is the only day-1 Kreyòl; every instance carries data-en.
   3. Gate + diagnostic (pre-Unit-1 surfaces) are English-chrome only.
   4. Unit titles bilingual until their unit opens.
   5. Every rendered Kreyòl chrome string is long-pressable (data-en enforced by T()).
   6. Scope gaps fixed: wi, mwen, fini, semèn, fanmi, konprann, monte, kòmanse, kizin, lòd, reyaji added.
   7. Affordance de-conflation: .gloss = tappable content; .flipnew = newly flipped chrome (sun underline).
   8. Dev "Lint" button: runtime scan for untaught Kreyòl in rendered chrome. */

/* ---------------- scope items ---------------- */
const ITEMS = [
 ["nan","in / at",1,1,1],["ak","with",1,1,1],["yo","they / plural marker",1,1,1],["pou","for",1,1,1],
 ["a","the (after vowel)",3,1,0],["ki","who / which",1,1,1],["yon","a / one",1,1,1],["la","the (after consonant)",3,1,0],
 ["sou","on",1,1,1],["ou","you",1,1,1],["se","is / it's",2,1,1],["te","past marker",5,1,1],
 ["an","the (after nasal vowel)",3,1,0],["sa","this / that",2,1,1],["nou","we / us",1,1,1],["pa","not",1,1,1],
 ["li","he / she / it",1,1,1],["gen","have / there is",2,1,1],["pi","more (comparative)",2,1,1],["fè","do / make",2,1,1],

/* ============ ENGINE ============ */
function itemState(p,id){ if(!p.items[id]) p.items[id]={rec:{box:0,due:1,hist:[]},prod:{box:0,due:1,hist:[]}}; return p.items[id]; }
function seedTiers(p){ ITEMS.forEach(it=>{ const t=p.tiers[it.id]||"B"; const st=itemState(p,it.id);
  if(t==="A"&&st.rec.box===0){st.rec.box=2; st.rec.due=S.day+INTERVALS[2];} }); }
function review(p,id,mode,ok){ const st=itemState(p,id)[mode]; st.hist.push({d:S.day,ok});
  if(ok){st.box=Math.min(3,st.box+1);}else{st.box=Math.max(0,st.box-1);} st.due=S.day+INTERVALS[st.box]; }
function mastery(p,id,mode){ const st=itemState(p,id)[mode],h=st.hist;
  if(mode==="prod"){ const l3=h.slice(-3);
    if(l3.length===3&&l3.every(x=>x.ok)&&(l3[2].d-l3[0].d)>=7)return"solid";
  } else { if(st.box>=3&&h.length&&h.slice(-2).every(x=>x.ok))return"solid"; }
  if(h.some(x=>x.ok)||st.box>0)return"aktive"; return"pa"; }
function kleSolid(p){ return ITEMS.filter(i=>i.kle&&mastery(p,i.id,"rec")==="solid").length; }
function dueItems(p){ return ITEMS.filter(i=>i.u<=S.unit&&itemState(p,i.id).rec.due<=S.day); }
function skillPct(p){ const sc=ITEMS.filter(i=>i.u<=S.unit);
  const rec=sc.filter(i=>mastery(p,i.id,"rec")!=="pa").length/Math.max(1,sc.length);
  const ps=sc.filter(i=>i.pc); const prod=ps.filter(i=>mastery(p,i.id,"prod")!=="pa").length/Math.max(1,ps.length);
  return {konprann:Math.min(1,.55+rec*.4),li:rec,pale:prod,ekri:prod*.6}; }
function practiceToday(p){ if(p.lastDay!==S.day){p.streak=(p.lastDay===S.day-1)?p.streak+1:1;p.lastDay=S.day;}
  if(S.konbit.lastDay!==S.day){S.konbit.streak=(S.konbit.lastDay>=S.day-1)?S.konbit.streak+1:1;S.konbit.lastDay=S.day;} save(); }
function addXP(p,n){ p.xp+=n; practiceToday(p); save(); }

      <p class="boardnote">Guessing is fine — a miss just means "Acquire tier," not failure.</p>

}
function shuffleOpts(i){ const [,opts,correct]=DIAG[i]; const pairs=opts.map((o,ix)=>[o,ix===correct]);
  for(let j=pairs.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[pairs[j],pairs[k]]=[pairs[k],pairs[j]];}
  S._diagKey=pairs.map(x=>x[1]); return pairs.map(x=>x[0]); }
function answerDiag(ix){ const p=S.profiles[S.current],q=S.quiz,ok=S._diagKey[ix];
  p.tiers[DIAG[q.i][0]]=ok?"A":"C"; if(ok)q.score++; q.i++;
  if(q.i<DIAG.length)q.shuffled=shuffleOpts(q.i); render(); }
function finishDiag(decode){ const p=S.profiles[S.current],sc=S.quiz.score;
  p.band=(sc>=10&&decode===2)?"Strong (~600)":(sc>=7)?"Moderate (~450)":"Emerging (~300)";
  ITEMS.forEach(it=>{ if(!p.tiers[it.id]) p.tiers[it.id]=p.band.startsWith("Strong")?"A":(p.band.startsWith("Moderate")?(it.kle?"A":"B"):"B"); });
  p.diagDone=true; seedTiers(p); addXP(p,30); S.quiz=null; S.active="dash"; save(); render();
  toast(`${p.name} · band ${p.band} · tiers set from your answers`); }

        ${L.done?`<div class="note" style="margin-top:4px">${T("done")} ${L.tip?`<div class="konsey">"${esc(L.tip)}"</div>`:""}</div>`
          :(k===me?`<div style="margin-top:10px"><button class="cta ${k==="leo"?"cobalt":"red"}" data-monstart="1" style="font-size:15px;padding:10px 20px">${T("climb")}</button></div>`
                  :`<div class="note" style="margin-top:6px">waiting…</div>`)}
      </div>`;}).join("")}
    </div>
    ${bothDone?(total>=m.threshold
        ?`<div class="panel" style="padding:22px;border-width:3px"><span class="stamp palm new">${T("summit_stamp")}</span>
           <p style="margin-top:12px">${T("summit_body")} — <b class="num">+40</b> ${T("pts")} each.</p></div>`
        :`<div class="panel well" style="padding:22px"><b class="disp d3">${T("waits")}</b>
           <p class="note" style="margin-top:6px"><span class="num">${total}</span>/${m.threshold} — retry tomorrow with each other's tips. Nobody loses. (Advance the day in Prototype to retry.)</p></div>`)
    :(otherLeg.done&&!myLeg.done
        ?`<div class="panel" style="padding:22px"><b class="disp d3">${S.profiles[other].name} ${T("rope_pass")}</b>
          <p class="note" style="margin:6px 0 12px">His tip is on his card. Your leg needs <b class="num" style="color:var(--ink)">${Math.max(0,m.threshold-otherLeg.score)}+</b> to summit together.</p>
          <button class="cta ${me==="leo"?"cobalt":"red"}" data-monstart="1">${T("climb")}</button></div>`:"")}
  </div></main>`;
}
function vMonTip(q){
  return `<main><div class="stage">
    <div class="lbl" style="text-align:center;margin-bottom:10px">${T("leg_done")} · <b class="num" style="color:var(--ink)">${q.score}</b>/10</div>
    <div class="boardbox board"><div class="chalkbar"><i style="width:100%"></i></div>
      <p class="qp" style="font-size:26px">${T("tip")}</p>
      <p style="text-align:center;color:#9db0bd;font-size:13.5px;margin:-12px 0 8px">${T("tip_why")}</p>
      <input class="tipbox" id="tipInput" maxlength="90" placeholder='"nan = after nasal sounds, watch for it"'
        style="width:100%;max-width:420px;display:block;margin:14px auto;padding:12px 14px;font:inherit;background:#2c3d49;border:2px dashed var(--chalk);color:var(--chalk)">
      <div style="text-align:center"><button class="cta sun" data-montip="1">${T("pass_rope")}</button></div>
      <div class="tray"></div></div></div></main>`;
}
function startMonLeg(){
  const me=S.current; let bank;
  if(me==="isaac"){
    const pool=ITEMS.filter(i=>i.kle&&i.u<=S.unit);
    bank=pool.sort(()=>Math.random()-.5).slice(0,10).map(it=>{
      let wrong=it; while(wrong.id===it.id){ wrong=pool[Math.floor(Math.random()*pool.length)]; }
      const opts=Math.random()<.5?[it.en,wrong.en]:[wrong.en,it.en];
      return {prompt:`« ${it.ht} »`,opts,c:opts.indexOf(it.en),ids:[it.id]};});
  } else {
    const d=DETERMINERS.slice(0,5).map(([s,c,w])=>{const opts=Math.random()<.5?[c,w]:[w,c];return{prompt:s.replace("___","______"),opts,c:opts.indexOf(c),ids:["la","a","an","lan"]};});
    const c=CONTRACTIONS.slice(0,5).map(([f,c1,w])=>{const opts=Math.random()<.5?[c1,w]:[w,c1];return{prompt:`« ${f} » = ?`,opts,c:opts.indexOf(c1),ids:["ap","te","pa"]};});
    bank=d.concat(c);
  }
  S.quiz={kind:"mon",i:0,score:0,bank,fb:""}; render();
}
function answerMon(ok){
  const p=S.profiles[S.current], q=S.quiz, item=q.bank[q.i];
  item.ids.forEach(id=>review(p,id,"rec",!!ok));
  if(ok){q.score++; addXP(p,3);}
  q.fb= ok?`<span class="yes">${Tt("yes")}.</span>`:`→ <b style="color:var(--sun)">${item.opts[item.c]}</b>`;
  q.i++; save(); render();
}
function submitTip(){
  const t=document.getElementById("tipInput").value.trim();
  if(!t){ toast("The tip is required (§7)"); return; }
  const m=S.konbit.mon, me=S.current;
  m.legs[me]={done:true,score:S.quiz.score,tip:t};
  (S.profiles[me].session[S.day]=S.profiles[me].session[S.day]||{}).mon=true;
  const total=m.legs.isaac.score+m.legs.leo.score;
  if(m.legs.isaac.done&&m.legs.leo.done&&total>=m.threshold&&!m.summited){
    m.summited=true; S.profiles.leo.xp+=40; S.profiles.isaac.xp+=40;
    toast(Tt("summit_stamp")+" — shared badge, +40 "+Tt("pts")+" each");
  }
  S.quiz=null; save(); render();
}

/* ---------- Pwodiksyon ---------- */
let mediaRec=null,chunks=[],lastUrl=null,recTimer=null,recStart=0;
function vProd(){
  const p=S.profiles[S.current], done=(p.session[S.day]||{}).prod;
  return `<main><div class="col">
    <div class="lbl">${T("prod")} · Unit 3</div>
    <h1 class="disp d1">${T("prod_title")}</h1>
    <div class="stripe"></div>
    <p class="note">Real build: listen–compare–rerecord against Manman's reference audio (§8). Reference slots await family recordings.</p>
    <ul class="prompts">
      ${["Louvri dlo a.","Mete diri a nan dlo a.","Kwit pwa yo.","Koupe legim yo.","Goute manje a!"].map(s=>`<li><b>${s}</b><span class="ref">${T("ref_family")}</span></li>`).join("")}
    </ul>
    <div class="recfield" id="recField">
      <div class="lbl" id="recState" style="color:inherit">Hold the button · release to stop</div>
      <div class="heronum" id="recClock" style="margin:6px 0">0.0</div>
      <button id="recBtn" class="btn" style="font-size:14px;padding:12px 26px">HOLD TO RECORD</button>
      <div id="playWrap" style="margin-top:12px"></div>
    </div>
    <div style="margin-top:18px;text-align:center">${done?`<span class="stamp palm">${T("mission_done")}</span>`
      :`<button class="cta sun" data-proddone="1">Mark set complete · +20 ${T("pts")}</button>`}</div>
  </div></main>`;
}
function bindRecorder(){
  const btn=document.getElementById("recBtn"); if(!btn)return;
  const st=document.getElementById("recState"), fld=document.getElementById("recField"), clk=document.getElementById("recClock");
  const start=async e=>{e.preventDefault();
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[]; mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=ev=>chunks.push(ev.data);
      mediaRec.onstop=()=>{ if(lastUrl)URL.revokeObjectURL(lastUrl);
        lastUrl=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));
        document.getElementById("playWrap").innerHTML=`<audio controls src="${lastUrl}"></audio>`;
        stream.getTracks().forEach(t=>t.stop()); };
      mediaRec.start(); fld.classList.add("live"); st.textContent="RECORDING";
      recStart=performance.now();
      recTimer=setInterval(()=>{clk.textContent=((performance.now()-recStart)/1000).toFixed(1);},100);
    }catch(err){ st.textContent="Mic unavailable — grant permission on the shared PC."; }};
  const stop=()=>{ if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop();fld.classList.remove("live");
    st.textContent="Play it back · compare · rerecord"; clearInterval(recTimer);} };
  btn.addEventListener("pointerdown",start);
  btn.addEventListener("pointerup",stop);
  btn.addEventListener("pointercancel",stop);
}
function prodDone(){
  const p=S.profiles[S.current];
  ["louvri","mete","kwit","koupe","goute","diri","dlo","pwa","manje"].forEach(id=>review(p,id,"prod",true));
  (p.session[S.day]=p.session[S.day]||{}).prod=true; addXP(p,20); save(); render();
}

/* ---------- Misyon ---------- */
function vMisyon(){
  const cur=MISSIONS.find(x=>x.u===S.unit);
  const st=S.missions[S.unit]||{stars:0,done:false};
  return `<main><div style="max-width:700px;margin:0 auto">
    <div class="lbl">${T("misyon")} · Unit ${S.unit} · Leo + Isaac</div>
    <div class="goldsheet poster" style="margin-top:10px">
      <h2>${cur.t.toUpperCase()}</h2>
      <p style="font-size:15px;max-width:520px">${cur.d}</p>
      <div class="starrow">
        <span class="lbl" style="color:var(--ink)">${T("momrates")}</span>
        <div class="starbox">${[1,2,3,4,5].map(n=>`<button class="star ${st.stars>=n?"on":""}" data-star="${n}">${n}</button>`).join("")}</div>
        ${st.stars?`<b class="num">${st.stars}/5</b>`:""}</div>
      <div style="margin-top:22px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">
        ${st.done?`<span class="stamp new">${T("mission_done")}</span>`
          :`<button class="cta cobalt" data-mdone="1">${T("markdone")}</button>`}
        <button class="btn" data-go="prod">${T("anrejistre")}</button></div>
    </div>
    <section class="index" style="margin-top:26px">
      <div class="lbl">${T("allunits")}</div>
      ${MISSIONS.map(x=>`<div class="row"><span><b class="num" style="color:var(--dim)">U${x.u}</b> &nbsp;${unitTitle(x.u)} — ${x.t}</span>
        <span>${(S.missions[x.u]||{}).done?`<span class="stamp palm" style="font-size:9.5px;padding:1px 8px;transform:none">${Tt("mission_done")} · ${(S.missions[x.u]||{}).stars||0}/5</span>`
          :(x.u===S.unit?`<span class="stamp" style="font-size:9.5px;padding:1px 8px;transform:none">${T("current_stamp")}</span>`:`<span class="note">—</span>`)}</span></div>`).join("")}
    </section>
    <p class="note" style="margin-top:16px">Family brief (printable in real build): <b style="color:var(--ink)">recast</b>, don't correct mid-sentence · never mock accent · praise attempts specifically. Manman's role alternates weekly: judge / interviewee / co-player.</p>
  </div></main>`;
}

/* ---------- Settings ---------- */
function vSettings(){
  const p=S.profiles[S.current];
  return `<main><div class="col">
    <h1 class="disp d1">${T("settings")}</h1>
    <div class="stripe"></div>
    <div class="lbl" style="margin-top:8px">${p.name}</div>
    <div class="row"><span>${T("pwomode")}</span><button class="btn" data-pwo="1">${p.pwoMode?"ON":"OFF"}</button></div>
    <div class="row"><span>Band (diagnostic result)</span><b>${p.band||"—"}</b></div>
    <div class="row"><span>Redo diagnostic</span><button class="btn" data-rediag="1">Run</button></div>
    <div class="row"><span>Long-press any underlined or highlighted Kreyòl</span><span class="note">reveals English (§9)</span></div>
    <div class="lbl" style="margin-top:26px">Program</div>
    <div class="row"><span>Current unit</span><b>Unit ${S.unit} — preview flips via Prototype card</b></div>
    <div class="row"><span>${T("padon")}</span><b class="num">${S.padon}</b></div>
    <div class="row"><span>Persistence</span><span class="note">prototype: localStorage · real: file JSON + backups (§10)</span></div>
  </div></main>`;
}

/* ============ ROUTER / EVENTS ============ */
function render(){
  const views={gate:vGate,dash:vDash,fil:vFil,fokis:vFokis,prod:vProd,mon:vMon,misyon:vMisyon,settings:vSettings};
  let html="";
  if(S.active!=="gate"&&!S.current)S.active="gate";
  if(S.active!=="gate"){
    const p=S.profiles[S.current];
    if(!p.diagDone&&S.quiz&&S.quiz.kind===undefined){ html=chrome()+vDiag(p); }
    else html=chrome()+views[S.active]();
  } else html=vGate();
  app.innerHTML=html;
  bindRecorder();
  document.getElementById("devDay").textContent=S.day;
  document.getElementById("devUnit").value=S.unit;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go],[data-pick],[data-react],[data-got],[data-gloss],[data-fokis],[data-j],[data-monstart],[data-mon],[data-montip],[data-diag],[data-decode],[data-micro],[data-mdone],[data-star],[data-pwo],[data-rediag],[data-proddone]");
  if(!b)return;
  const p=S.current?S.profiles[S.current]:null;
  if(b.dataset.pick){ S.current=b.dataset.pick; const pr=S.profiles[S.current];
    if(!pr.diagDone){ S.quiz={i:0,score:0,shuffled:shuffleOpts(0)}; S.active="diag"; render(); return; }
    S.active="dash"; render(); return; }
  if(b.dataset.diag!==undefined){ answerDiag(+b.dataset.diag); return; }
  if(b.dataset.decode!==undefined){ finishDiag(+b.dataset.decode); return; }
  if(b.dataset.go){ S.active=b.dataset.go==="dash"&&!S.current?"gate":b.dataset.go; S.quiz=null; render(); return; }
  if(b.dataset.react){ p.reactions["p_"+b.dataset.react]=1; p.reactions[S.day]=(p.reactions[S.day]||0)+1;
    addXP(p,5); if(p.reactions[S.day]>=3)(p.session[S.day]=p.session[S.day]||{}).fil=true; render(); return; }
  if(b.dataset.got){ const post=POSTS.find(x=>x.id===b.dataset.got);
    post.items.forEach(id=>review(p,id,"rec",true)); p.reactions["g_"+post.id]=1; addXP(p,4);
    toast(`${post.items.length} items → receptive ledger`); render(); return; }
  if(b.dataset.gloss){ toast(b.dataset.gloss); return; }
  if(b.dataset.fokis){ startFokis(); return; }
  if(b.dataset.j!==undefined){ answerFokis(+b.dataset.j); return; }
  if(b.dataset.monstart){ startMonLeg(); return; }
  if(b.dataset.mon!==undefined){ answerMon(+b.dataset.mon); return; }
  if(b.dataset.montip){ submitTip(); return; }
  if(b.dataset.micro){ p.micro[S.day]=true; addXP(p,10); render(); return; }
  if(b.dataset.mdone){ S.missions[S.unit]=S.missions[S.unit]||{stars:0}; S.missions[S.unit].done=true;
    S.konbit.stars=Math.min(10,S.konbit.stars+(S.missions[S.unit].stars||3)); addXP(p,25); render(); return; }
  if(b.dataset.star){ S.missions[S.unit]=S.missions[S.unit]||{done:false}; S.missions[S.unit].stars=+b.dataset.star; save(); render(); return; }
  if(b.dataset.pwo){ p.pwoMode=!p.pwoMode; save(); render(); return; }
  if(b.dataset.rediag){ p.diagDone=false; p.band=null; p.tiers={}; S.quiz={i:0,score:0,shuffled:shuffleOpts(0)}; render(); return; }
  if(b.dataset.proddone){ prodDone(); return; }
});
/* long-press English reveal — works on .flip (chrome) and .gloss (content) */
let pressTimer=null;
const tipEl=document.getElementById("tip");
document.addEventListener("pointerdown",e=>{
  const f=e.target.closest(".flip,.gloss");
  if(!f)return;
  const txt=f.dataset.en||f.dataset.gloss;
  if(!txt)return;
  pressTimer=setTimeout(()=>{ tipEl.textContent=txt; tipEl.style.display="block";
    tipEl.style.left=Math.min(window.innerWidth-290,Math.max(10,e.clientX-60))+"px";
    tipEl.style.top=Math.max(10,e.clientY-52)+"px"; },420);
});
document.addEventListener("pointerup",()=>{clearTimeout(pressTimer);tipEl.style.display="none";});
document.addEventListener("pointercancel",()=>{clearTimeout(pressTimer);tipEl.style.display="none";});

/* dev card + runtime language lint */
document.getElementById("devToggle").addEventListener("click",()=>document.getElementById("devPanel").classList.toggle("open"));
document.getElementById("devAdvance").addEventListener("click",()=>{
  const yesterday=S.day; S.day++;
  if(S.konbit.lastDay<yesterday){
    if(S.padon>0){S.padon--; toast("Padon used — konbit streak repaired");}
    else {S.konbit.streak=0; toast("Konbit streak reset.");}}
  const m=S.konbit.mon;
  if(m.legs.isaac.done&&m.legs.leo.done&&!m.summited){
    m.legs={isaac:{done:false,score:0,tip:m.legs.isaac.tip},leo:{done:false,score:0,tip:m.legs.leo.tip}};}
  save(); render();
});
const unitSel=document.getElementById("devUnit");
for(let u=1;u<=8;u++){const o=document.createElement("option");o.value=u;o.textContent="Unit "+u;unitSel.appendChild(o);}
unitSel.addEventListener("change",()=>{S.unit=+unitSel.value;S.konbit.mon.unit=S.unit;save();render();});
document.getElementById("devReset").addEventListener("click",()=>{localStorage.removeItem(KEY);S=fresh();render();});
document.getElementById("devExport").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="konbit-kreyol-state.json";a.click();});

/* Runtime lint (audit enforcement, prototype edition):
   walks rendered CHROME text nodes (skips .kt content, quotes, test items),
   flags Kreyòl-diacritic tokens or scope words not inside .flip/.gloss. */
const SCOPE=new Set(ITEMS.flatMap(i=>i.id.split(" ")));
const WHITELIST=new Set(["kreyòl","konbit","leo","isaac","manman","grann","léa","kokoyé","sixto","tabou","combo","voa","ipn","lodyans","vwadyo","kapstòn"]);
document.getElementById("devLint").addEventListener("click",()=>{
  const bad=[];
  const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    const n=walker.currentNode, el=n.parentElement;
    if(!el||el.closest(".flip,.gloss,.kt,.qp,.prompts,.konsey,.tag,option"))continue;
    n.textContent.toLowerCase().split(/[^a-zàèòù]+/).forEach(w=>{
      if(!w)return;
      const kreyolish=/[àèòù]/.test(w)||SCOPE.has(w);
      if(kreyolish&&!WHITELIST.has(w)&&!["a","la","an","san","men","non","pa","ta","bay","band","plate"].includes(w)) bad.push(w);
    });
  }
  toast(bad.length?("LINT: ungated Kreyòl in chrome → "+[...new Set(bad)].slice(0,8).join(", ")):"LINT: chrome clean — no ungated Kreyòl");
});

function toast(msg){const t=document.createElement("div");t.className="receipt";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

render();
</script>
